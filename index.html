<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RPP PNBP BMKG 2026 — Analisis Lampiran (PP 47/2018 vs RPP 2026)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --slate-900:#0f172a; --slate-700:#334155; --slate-500:#64748b; --slate-400:#94a3b8;
  --slate-300:#cbd5e1; --slate-200:#e2e8f0; --slate-100:#f1f5f9; --slate-50:#f8fafc;
  --green:#16a34a; --amber:#d97706; --blue:#2563eb; --red:#dc2626;
  --green-bg:#dcfce7; --amber-bg:#fef3c7; --blue-bg:#dbeafe; --red-bg:#fee2e2;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color:var(--slate-900); background:#fff; font-size:13px; -webkit-font-smoothing:antialiased;
}
code,.mono{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace}

/* ---------------------------- hero / infographic ---------------------------- */
.hero{
  display:grid; grid-template-columns:minmax(220px,.8fr) minmax(0,1.5fr); gap:16px 24px;
  align-items:center; padding:20px 24px 16px; color:var(--slate-900);
  background:radial-gradient(ellipse at 90% 0%,rgba(96,165,250,.2),transparent 42%),
    linear-gradient(125deg,#f8fbff 0%,#edf5ff 58%,#f0fdfa 100%);
  border-bottom:1px solid #dbeafe;
}
.hero-heading{min-width:0}
.hero-kicker{display:block; margin-bottom:6px; color:#1d4ed8; font-size:10px; font-weight:700; letter-spacing:.13em; text-transform:uppercase}
.hero h1{font-size:22px; font-weight:750; margin:0; letter-spacing:-.035em; color:#0f172a}
.hero-heading > small{display:block; margin-top:7px; color:#64748b; font-size:11px; line-height:1.5}
.hero-overview{display:grid; grid-template-columns:minmax(95px,.65fr) minmax(95px,.65fr) minmax(210px,1.7fr); align-items:stretch; gap:10px}
.hero-total,.hero-chart{min-height:82px; padding:11px 13px; border:1px solid #dbeafe; border-radius:12px; background:rgba(255,255,255,.8); box-shadow:0 8px 22px rgba(30,64,175,.045)}
.hero-total{display:flex; flex-direction:column; justify-content:center; gap:3px}
.hero-total span{color:#64748b; font-size:10px; font-weight:700; letter-spacing:.07em; text-transform:uppercase}
.hero-total strong{font-size:24px; line-height:1; font-variant-numeric:tabular-nums; color:#0f172a}
.hero-total small{color:#64748b; font-size:10px}
.hero-total-new{background:#eff6ff}
.hero-chart{display:flex; flex-direction:column; justify-content:center; gap:8px}
.chart-head{display:flex; justify-content:space-between; gap:8px; color:#334155; font-size:10px; font-weight:600}
#progress{height:10px; display:flex; overflow:hidden; border-radius:999px; background:#e2e8f0}
.seg{height:100%; min-width:0; transition:width .25s ease}
.seg-green{background:#22c55e} .seg-amber{background:#f59e0b}
.seg-blue{background:#3b82f6} .seg-red{background:#ef4444}
.chart-legend{display:flex; flex-wrap:wrap; gap:4px 10px; color:#64748b; font-size:9px}
.chart-legend span{white-space:nowrap}
.chart-legend b{color:#0f172a; font-variant-numeric:tabular-nums}
.pills{grid-column:1/-1; display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:9px}
.filter-chip{
  display:flex; align-items:center; justify-content:space-between; gap:10px; min-width:0;
  padding:9px 12px; border:1px solid #dbe5f1; border-radius:11px;
  color:#334155; background:rgba(255,255,255,.82); font:inherit; text-align:left; cursor:pointer;
  box-shadow:0 3px 10px rgba(15,23,42,.035);
  transition:transform .16s ease, background .16s ease, border-color .16s ease, box-shadow .16s ease;
}
.filter-chip:hover{transform:translateY(-1px); background:#fff; border-color:#93c5fd; box-shadow:0 6px 16px rgba(37,99,235,.09)}
.filter-chip:focus-visible{outline:3px solid #60a5fa; outline-offset:2px}
.filter-chip.active{background:#1d4ed8; color:#fff; border-color:#1d4ed8; box-shadow:0 5px 16px rgba(37,99,235,.2)}
.chip-label{font-size:10px; font-weight:700; letter-spacing:.09em}
.chip-value{display:flex; align-items:baseline; gap:7px}
.chip-value b{font-size:19px; line-height:1; font-variant-numeric:tabular-nums}
.chip-value small{font-size:9px; color:#64748b}
.filter-chip.active .chip-value small{color:#dbeafe}
.filter-chip[data-filter="BARU"]{border-left:3px solid #4ade80}
.filter-chip[data-filter="UBAH"]{border-left:3px solid #fbbf24}
.filter-chip[data-filter="TETAP"]{border-left:3px solid #60a5fa}
.filter-chip[data-filter="HAPUS"]{border-left:3px solid #f87171}

/* ---------------------------- toolbar ---------------------------- */
.toolbar{
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  padding:10px 20px; border-bottom:1px solid var(--slate-100); background:#fff;
  position:sticky; top:0; z-index:40;
}
.search{position:relative; flex:1 1 260px; min-width:200px}
.search input{
  width:100%; padding:7px 11px 7px 30px; border:1px solid var(--slate-200); border-radius:8px;
  font:inherit; font-size:12.5px; outline:none; background:var(--slate-50);
}
.search input:focus{border-color:var(--blue); background:#fff; box-shadow:0 0 0 3px var(--blue-bg)}
.search svg{position:absolute; left:9px; top:50%; transform:translateY(-50%); color:var(--slate-400)}
select.ctl{
  padding:7px 10px; border:1px solid var(--slate-200); border-radius:8px; background:var(--slate-50);
  font:inherit; font-size:12.5px; outline:none; cursor:pointer;
}
.sort-controls{display:inline-flex; align-items:center; gap:5px}
.sort-control{display:inline-flex; align-items:center; gap:6px; color:var(--slate-500); font-size:11px; font-weight:600; white-space:nowrap}
.sort-control select.ctl{max-width:145px}
.sort-direction{width:34px; height:34px; display:inline-flex; align-items:center; justify-content:center; border:1px solid var(--slate-200); border-radius:8px; background:var(--slate-50); color:var(--slate-700); font-size:16px; cursor:pointer}
.sort-direction:hover{background:#fff; border-color:var(--slate-300)}
.sort-direction:focus-visible{outline:3px solid var(--blue-bg); border-color:var(--blue)}
.wrap{position:relative}
.btn-uke{
  padding:7px 11px; border:1px solid var(--slate-200); border-radius:8px; background:var(--slate-50);
  font:inherit; font-size:12.5px; cursor:pointer; color:var(--slate-700); white-space:nowrap;
}
.btn-uke:hover{border-color:var(--slate-300)}
.menu{
  display:none; position:absolute; top:calc(100% + 6px); left:0; z-index:60; min-width:190px;
  max-height:320px; overflow:auto; background:#fff; border:1px solid var(--slate-200);
  border-radius:10px; box-shadow:0 12px 34px rgba(15,23,42,.14); padding:6px;
}
.menu.open{display:block}
.chk{display:flex; align-items:center; gap:8px; padding:6px 8px; border-radius:7px; cursor:pointer; font-size:12.5px}
.chk:hover{background:var(--slate-50)}
.menu-head{display:flex; justify-content:space-between; align-items:center; padding:4px 8px 6px; border-bottom:1px solid var(--slate-100); margin-bottom:4px}
.menu-head span{font-size:10.5px; color:var(--slate-400); font-weight:600; letter-spacing:.04em}
.menu-head button{border:0; background:none; color:var(--blue); font:inherit; font-size:11px; cursor:pointer; padding:2px 4px}

.toggle-wrap{display:inline-flex; align-items:center; gap:8px; padding:5px 11px; border-radius:999px; border:1px solid var(--slate-200); background:var(--slate-50); cursor:pointer; user-select:none}
.toggle-wrap .lbl{font-size:12px; font-weight:600; color:var(--slate-500)}
.toggle-wrap.on{border-color:var(--red); background:var(--red-bg)}
.toggle-wrap.on .lbl{color:var(--red)}
.switch{position:relative; width:34px; height:18px; border-radius:999px; background:var(--slate-300); transition:.18s}
.switch::after{content:''; position:absolute; top:2px; left:2px; width:14px; height:14px; border-radius:50%; background:#fff; transition:.18s; box-shadow:0 1px 2px rgba(0,0,0,.2)}
.toggle-wrap.on .switch{background:var(--red)}
.toggle-wrap.on .switch::after{left:18px}
.toggle-wrap input{position:absolute; opacity:0; pointer-events:none}
.btn{
  padding:7px 12px; border:1px solid var(--slate-200); border-radius:8px; background:#fff;
  font:inherit; font-size:12.5px; font-weight:600; cursor:pointer; color:var(--slate-700); text-decoration:none; display:inline-flex; align-items:center; gap:6px;
}
.btn:hover{background:var(--slate-50)}
.btn.primary{background:var(--slate-900); border-color:var(--slate-900); color:#fff}
.btn.primary:hover{background:#1e293b}

/* ---------------------------- notice ---------------------------- */
.notice{margin:0 20px 12px; padding:10px 14px; border-radius:10px; background:var(--amber-bg); color:#92400e;
  font-size:12px; border-left:3px solid var(--amber)}

/* ---------------------------- table ---------------------------- */
.tablewrap{padding:12px 20px 40px; background:var(--slate-50)}
table{width:100%; min-width:820px; border-collapse:collapse; table-layout:fixed; background:#fff; box-shadow:0 0 0 1px var(--slate-200)}
thead th{
  position:sticky; top:var(--toolbar-h, 57px); z-index:10; background:rgba(255,255,255,.96); backdrop-filter:blur(8px);
  text-align:left; font-size:10px; font-weight:700; letter-spacing:.05em; color:var(--slate-500);
  text-transform:uppercase; padding:9px 10px; border-bottom:1px solid var(--slate-200);
}
th.c-id{width:198px} th.c-uke{width:124px} th.c-tarif{width:204px} th.c-act{width:58px; text-align:center}
th[data-sort][aria-sort="ascending"],th[data-sort][aria-sort="descending"]{color:#1d4ed8}
.sort-heading{display:inline-flex; align-items:center; gap:6px; padding:0; border:0; background:none; color:inherit; font:inherit; letter-spacing:inherit; text-transform:inherit; cursor:pointer}
.sort-heading:hover{color:#1d4ed8}
.sort-heading:focus-visible{outline:2px solid #60a5fa; outline-offset:3px; border-radius:3px}
.sort-mark{color:#94a3b8; font-size:11px}
[aria-sort="ascending"] .sort-mark,[aria-sort="descending"] .sort-mark{color:#1d4ed8}
tbody tr{height:40px; border-bottom:1px solid var(--slate-100)}
tbody tr.row-group-start td{border-top:1px solid #e2e8f0}
tbody tr:hover{background:var(--slate-50)}
tbody td{padding:6px 10px; vertical-align:middle}
.center{text-align:center} .muted{color:var(--slate-400); padding:40px 0}

/* compact ID and category cell */
.td-id{font-variant-numeric:tabular-nums}
.idcol{line-height:1.15; min-width:0}
.idline{display:flex; align-items:center; flex-wrap:wrap; gap:5px}
.idbaru{font-family:'JetBrains Mono',monospace; font-size:10px; font-weight:700; color:var(--slate-900); white-space:nowrap}
.idlama{display:block; padding-top:3px; font-family:'JetBrains Mono',monospace; font-size:9px; color:var(--slate-400); white-space:nowrap}
.id-hapus{color:var(--red); text-decoration:line-through}
.idline .badge{padding:2px 6px; font-size:8px}

/* compact, grouped service hierarchy */
.td-hier{overflow:hidden}
.hier{display:grid; grid-template-columns:15px minmax(0,1fr); align-items:start; column-gap:5px; line-height:1.28; min-width:0}
.icon{grid-column:1; grid-row:1 / span 2; font-size:12px; margin-top:1px; text-align:center}
.parents{grid-column:2; grid-row:1; color:var(--slate-500); font-size:10px; font-weight:500; line-height:1.3; overflow-wrap:anywhere}
.parents i{color:var(--slate-300); font-style:normal; margin:0 3px}
.leaf{grid-column:2; grid-row:2; font-size:12px; font-weight:650; color:#111827; line-height:1.35; overflow-wrap:anywhere}
.leaf-hapus{text-decoration:line-through; color:var(--slate-500)}

/* deterministic UKE II colors: each label keeps its hue when filtering/sorting */
.ukepill{
  display:inline-block; padding:4px 8px; border:1px solid hsl(var(--uke-hue,220) 62% 76%); border-radius:999px; font-size:9.5px; font-weight:700;
  background:hsl(var(--uke-hue,220) 78% 92%); color:hsl(var(--uke-hue,220) 68% 27%); letter-spacing:.015em; white-space:nowrap;
}
.uke-inherited{background:hsl(var(--uke-hue,220) 82% 97%); color:hsl(var(--uke-hue,220) 55% 31%); border:1px dashed hsl(var(--uke-hue,220) 50% 75%); font-style:italic}
.uke-empty{color:var(--slate-300)}
.chk{--uke-hue:220}
.uke-swatch{width:9px; height:9px; flex:none; border-radius:50%; background:hsl(var(--uke-hue) 66% 42%); box-shadow:0 0 0 2px hsl(var(--uke-hue) 70% 94%)}
.uke-name{min-width:0; overflow-wrap:anywhere}

/* badges */
.badge{display:inline-block; padding:2px 8px; border-radius:6px; font-size:10px; font-weight:700; letter-spacing:.03em}
.badge.inline{margin-left:8px}
.badge-green{background:var(--green-bg); color:var(--green)}
.badge-amber{background:var(--amber-bg); color:var(--amber)}
.badge-blue{background:var(--blue-bg); color:var(--blue)}
.badge-red{background:var(--red-bg); color:var(--red)}

/* tarif cell */
.tarif{display:flex; flex-wrap:wrap; align-items:center; gap:6px; line-height:1.2}
.tarif .satuan{flex-basis:100%; font-size:10px; color:var(--slate-400); font-weight:400}
.t-green{color:var(--green)} .t-amber{color:var(--amber)} .t-blue{color:var(--blue)} .t-red{color:var(--red)}
.t-old{color:var(--slate-300); font-weight:600}
.arrow{color:var(--slate-300)}
.chip{display:inline-block; padding:2px 7px; border-radius:6px; font-size:9px; font-weight:700; background:var(--slate-100); color:var(--slate-500); white-space:nowrap}
.chip-change-small{background:#dcfce7; color:#15803d; border:1px solid #bbf7d0}
.chip-change-large{background:#fff7ed; color:#c2410c; border:1px solid #fed7aa}

/* action */
.td-act{text-align:center}
.act{
  width:30px; height:30px; border:1px solid var(--slate-200); border-radius:8px; background:#fff;
  color:var(--slate-500); cursor:pointer; display:inline-flex; align-items:center; justify-content:center;
}
.act:hover{border-color:var(--slate-300); color:var(--slate-900); background:var(--slate-50)}
.act-hapus:hover{color:var(--red); border-color:var(--red)}

/* hapus row */
.row-hapus{background:#fef2f2}
.row-hapus:hover{background:#fee2e2}
.row-hapus td:first-child{box-shadow:inset 4px 0 0 var(--red)}

/* ---------------------------- drawer ---------------------------- */
.scrim{position:fixed; inset:0; background:rgba(15,23,42,.32); opacity:0; pointer-events:none; transition:.2s; z-index:80}
.scrim.open{opacity:1; pointer-events:auto}
.drawer{
  position:fixed; top:0; right:0; height:100%; width:480px; max-width:92vw; background:#fff; z-index:90;
  transform:translateX(100%); transition:transform .22s ease; box-shadow:-16px 0 40px rgba(15,23,42,.14);
  display:flex; flex-direction:column;
}
.drawer.open{transform:none}
.drawer header{display:flex; align-items:flex-start; gap:12px; padding:16px 18px; border-bottom:1px solid var(--slate-100)}
.drawer h2{margin:0; font-size:14px; font-weight:700}
.drawer .sub{font-size:12px; color:var(--slate-500); margin-top:4px}
.dmeta{margin-top:7px; font-size:11px; color:var(--slate-400)}
.dmeta b{color:var(--slate-700); font-weight:600}
.drawer .close{margin-left:auto; border:0; background:var(--slate-100); width:30px; height:30px; border-radius:8px; cursor:pointer; font-size:16px; color:var(--slate-500)}
.drawer .close:hover{background:var(--slate-200)}
.drawer .body{padding:16px 18px 40px; overflow:auto}
.field{padding:10px 0; border-bottom:1px dashed var(--slate-100)}
.flabel{font-size:10.5px; font-weight:700; letter-spacing:.02em; text-transform:none; color:var(--slate-500); margin-bottom:5px; line-height:1.45; overflow-wrap:anywhere}
.fval{font-size:12.5px; color:var(--slate-700); white-space:pre-wrap; word-break:break-word; line-height:1.6}
.source-links{display:flex; flex-wrap:wrap; gap:4px 12px; margin-top:2px}
.source-link{display:inline-flex; margin-top:5px; color:var(--blue); font-size:11.5px; font-weight:700; text-decoration:none; overflow-wrap:anywhere}
.source-link:hover{text-decoration:underline}
.link-unavailable{margin-top:6px; color:#a16207; font-size:10.5px; font-style:italic}
.fval.mono{font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--slate-900)}
.fval .empty{color:var(--slate-300)}
.warn{background:var(--amber-bg); color:#92400e; padding:10px 12px; border-radius:8px; font-size:11.5px; margin-bottom:12px}

/* ---------------------------- empty state ---------------------------- */
.emptystate{max-width:760px; margin:40px auto; padding:24px; border:1px solid var(--slate-200); border-radius:14px; text-align:left}
.es-title{font-size:16px; font-weight:700; color:var(--red); margin-bottom:8px}
.emptystate p{color:var(--slate-500); line-height:1.6}
.attempts{list-style:none; padding:0; margin:14px 0}
.attempts li{padding:7px 10px; border-radius:8px; background:var(--slate-50); margin-bottom:5px; font-size:12px; font-family:'JetBrains Mono',monospace}
.attempts li.ok{color:var(--green)} .attempts li.fail{color:var(--red)}
.hint{font-size:12px; background:var(--slate-50); padding:12px 14px; border-radius:10px; border-left:3px solid var(--blue)}
.es-actions{display:flex; gap:10px; flex-wrap:wrap; margin-top:16px}

/* ---------------------------- status/footer ---------------------------- */
.statusbar{display:flex; gap:16px; align-items:center; padding:8px 20px; border-top:1px solid var(--slate-100); font-size:11px; color:var(--slate-500); flex-wrap:wrap}
.dot{width:7px; height:7px; border-radius:50%; display:inline-block; background:var(--slate-300); margin-right:5px}
.dot.ok{background:var(--green)} .dot.err{background:var(--red)}
.dot.loading{background:var(--amber); animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.link{border:0; background:none; color:var(--blue); font:inherit; cursor:pointer; text-decoration:underline; padding:0}
#count{color:var(--slate-400)}
@media (max-width:1020px){
  .hero{grid-template-columns:1fr; gap:14px}
  .hero-overview{grid-template-columns:minmax(100px,.6fr) minmax(100px,.6fr) minmax(210px,1.8fr)}
}
@media (max-width:720px){
  .hero{padding:17px 10px 14px}
  .hero h1{font-size:20px}
  .hero-overview{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hero-chart{grid-column:1/-1}
  .pills{grid-template-columns:repeat(2,minmax(0,1fr)); gap:7px}
  .filter-chip{padding:8px 9px}
  .toolbar{padding-left:10px; padding-right:10px}
  .tablewrap{padding:12px 8px 40px}
}
.allcols{margin-top:14px; border-top:1px solid var(--slate-100)}
.allcols summary{cursor:pointer; font-weight:600; font-size:12px; padding:10px 0; color:var(--slate-500)}
</style>
</head>
<body>
<header class="hero">
  <div class="hero-heading">
    <span class="hero-kicker">Dashboard perubahan tarif dan layanan</span>
    <h1>RPP PNBP BMKG 2026</h1>
    <small id="datasetSummary">Memuat ringkasan data…</small>
  </div>
  <div class="hero-overview">
    <div class="hero-total">
      <span>PP 47/2018</span>
      <strong id="semulaCount">—</strong>
      <small>layanan semula</small>
    </div>
    <div class="hero-total hero-total-new">
      <span>RPP 2026</span>
      <strong id="rppCount">—</strong>
      <small>layanan usulan</small>
    </div>
    <div class="hero-chart">
      <div class="chart-head"><span>Komposisi perubahan</span><span id="chartTotal">—</span></div>
      <div id="progress" role="img" aria-label="Komposisi kategori perubahan"></div>
      <div class="chart-legend" id="chartLegend"></div>
    </div>
  </div>
  <div class="pills" id="pills" aria-label="Filter kategori"></div>
</header>

<div class="toolbar">
  <label class="search">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input id="search" type="search" placeholder="Cari 4 kolom hirarki: jenis, subjenis, layanan, detil…" autocomplete="off">
  </label>
  <div class="sort-controls" aria-label="Pengurutan tabel">
    <label class="sort-control"><span>Urut</span>
      <select class="ctl" id="sortBy" aria-label="Urutkan berdasarkan">
        <option value="id">ID</option>
        <option value="service">Layanan</option>
        <option value="uke">UKE II</option>
        <option value="kategori">Kategori</option>
        <option value="tarif">Tarif</option>
      </select>
    </label>
    <button class="sort-direction" id="sortDirection" type="button" aria-label="Urut menaik" title="Urut menaik">↑</button>
  </div>
  <div class="wrap" id="ukeWrap">
    <button class="btn-uke" id="ukeBtn">UKE II (semua)</button>
    <div class="menu" id="ukeMenu">
      <div class="menu-head"><span>UKE II</span><button id="ukeClear" type="button">Bersihkan</button></div>
      <div id="ukeMenuItems"></div>
    </div>
  </div>
  <select class="ctl" id="kategori">
    <option value="SEMUA">Semua kategori</option>
    <option value="BARU">BARU</option>
    <option value="UBAH">UBAH</option>
    <option value="TETAP">TETAP</option>
    <option value="HAPUS">HAPUS</option>
  </select>
  <label class="toggle-wrap" id="hapusWrap">
    <span class="lbl">DIHAPUS</span>
    <span class="switch"></span>
    <input id="hapusToggle" type="checkbox">
  </label>
  <button class="btn" id="reload" title="Muat ulang data">&#8635; Muat ulang</button>
</div>

<div id="notice" class="notice" hidden></div>

<div class="tablewrap">
  <table id="dataTable">
    <colgroup>
      <col style="width:198px"><col><col style="width:124px"><col style="width:204px"><col style="width:58px">
    </colgroup>
    <thead id="tableHead">
      <tr>
        <th class="c-id" data-sort="id" aria-sort="ascending"><button class="sort-heading" type="button" data-sort="id">ID / Kategori <span class="sort-mark" aria-hidden="true">↑</span></button></th>
        <th data-sort="service" aria-sort="none"><button class="sort-heading" type="button" data-sort="service">Layanan <span class="sort-mark" aria-hidden="true">↕</span></button></th>
        <th class="c-uke" data-sort="uke" aria-sort="none"><button class="sort-heading" type="button" data-sort="uke">UKE II <span class="sort-mark" aria-hidden="true">↕</span></button></th>
        <th class="c-tarif" data-sort="tarif" aria-sort="none"><button class="sort-heading" type="button" data-sort="tarif">Tarif <span class="sort-mark" aria-hidden="true">↕</span></button></th>
        <th class="c-act">Aksi</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

<div class="statusbar">
  <span id="loadStatus"></span>
  <span id="count"></span>
  <span id="footerInfo" style="margin-left:auto"></span>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <header>
    <div>
      <h2 id="drawerTitle">Detail</h2>
      <div class="sub" id="drawerSub"></div>
    </div>
    <button class="close" id="drawerClose" aria-label="Tutup">&times;</button>
  </header>
  <div class="body" id="drawerBody"></div>
</aside>

<script type="module" src="./app.js"></script>
</body>
</html>
